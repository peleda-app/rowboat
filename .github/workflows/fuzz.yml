name: Fuzz

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "300"
  pull_request:
    paths:
      - "skein/fuzz/**"
      - "skein/crates/core/**"
      - "skein/crates/storage/**"
      - "skein/crates/keyring/**"
      - "skein/crates/keyring-local/**"
      - "skein/crates/itip/**"
      - "skein/crates/pim-dav/**"
      - "skein/crates/pim-jmap/**"
      - "skein/crates/pim-google/**"
      - "skein/crates/pim-graph/**"
      - "skein/crates/mail-imap/**"
      - "skein/crates/mail-jmap/**"
      - "skein/crates/mail-gmail/**"
      - "skein/crates/mail-graph/**"
      - "skein/crates/sse/**"
      - "skein/crates/push/**"
      - "skein/crates/oauth/**"
      - "skein/crates/send-smtp/**"
      - "skein/apps/skein/src/transfer.rs"
      - "skein/crates/view/src/parse.rs"
      - "skein/crates/view/src/threads.rs"
      - "baton/crates/**"
      - "baton/apps/**"
      - "baton/fuzz/**"
      - "fuzz/**"
      - "crates/api/**"
      - "crates/node/src/records.rs"
      - "crates/discover-autoconfig/**"
      - "crates/discover-net/**"
      - "crates/discover-srv/**"
      - ".github/workflows/fuzz.yml"

permissions: {}

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        layer: [baton, skein, "."]
    defaults:
      run:
        working-directory: rowboat/${{ matrix.layer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: rowboat
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: peleda-app/rinse
          path: rinse
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: peleda-app/bento
          path: bento
          persist-credentials: false
      - name: Install the pinned nightly
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"$/\1/p' fuzz/rust-toolchain.toml)" --profile minimal
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rowboat/${{ matrix.layer }}/fuzz -> target
      - name: fuzz-build
        run: bash fuzz/run.sh build
      - name: Fuzz every target
        env:
          SECONDS_PER_TARGET: ${{ github.event_name == 'pull_request' && '30' || inputs.seconds || '300' }}
        run: bash fuzz/run.sh all "$SECONDS_PER_TARGET"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes-${{ matrix.layer == '.' && 'node' || matrix.layer }}
          path: rowboat/${{ matrix.layer }}/fuzz/artifacts
          if-no-files-found: ignore
