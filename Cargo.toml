[workspace]
resolver = "3"
members = [
  "apps/*",
  "crates/*",
  "tests/integration",
  "tests/load",
  "baton/apps/*",
  "baton/crates/*",
  "baton/tests/load",
  "skein/apps/*",
  "skein/crates/*",
  "skein/tests/integration",
  "skein/tests/load",
]
exclude = ["fuzz", "baton/fuzz", "skein/apps/docs", "skein/fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "PolyForm-Noncommercial-1.0.0"
publish = false
repository = "https://github.com/peleda-app/rowboat"
homepage = "https://peleda-app.github.io/rowboat"

[workspace.dependencies]
baton-core = { path = "baton/crates/core" }
baton-state = { path = "baton/crates/state" }
baton-state-memory = { path = "baton/crates/state-memory" }
baton-lease = { path = "baton/crates/lease" }
baton-lease-cas = { path = "baton/crates/lease-cas" }
baton-signal = { path = "baton/crates/signal" }
baton-signal-local = { path = "baton/crates/signal-local" }
baton-seal = { path = "baton/crates/seal" }
baton-identity = { path = "baton/crates/identity" }
baton-link = { path = "baton/crates/link" }
baton-link-memory = { path = "baton/crates/link-memory" }
baton-link-iroh = { path = "baton/crates/link-iroh" }
baton-mesh = { path = "baton/crates/mesh" }
baton-mesh-memory = { path = "baton/crates/mesh-memory" }
baton-mesh-link = { path = "baton/crates/mesh-link" }
baton-signal-mesh = { path = "baton/crates/signal-mesh" }
baton-lease-quorum = { path = "baton/crates/lease-quorum" }
baton-liveness-mesh = { path = "baton/crates/liveness-mesh" }
baton-keys = { path = "baton/crates/keys" }
baton-group = { path = "baton/crates/group" }
baton-command = { path = "baton/crates/command" }
baton-fetch = { path = "baton/crates/fetch" }
baton-mailbox = { path = "baton/crates/mailbox" }
baton-wake = { path = "baton/crates/wake" }
baton-drop = { path = "baton/crates/drop" }
baton-mailbox-memory = { path = "baton/crates/mailbox-memory" }
baton-wake-mailbox = { path = "baton/crates/wake-mailbox" }
baton-drop-http = { path = "baton/crates/drop-http" }
baton-mailbox-drop = { path = "baton/crates/mailbox-drop" }
baton-drop-service = { path = "baton/apps/drop" }
baton-lease-server = { path = "baton/crates/lease-server" }
baton-group-server = { path = "baton/crates/group-server" }
batond = { path = "baton/apps/batond" }

skein-core = { path = "skein/crates/core", version = "0.0.0" }
skein-storage = { path = "skein/crates/storage", version = "0.0.0" }
skein-storage-memory = { path = "skein/crates/storage-memory", version = "0.0.0" }
skein-storage-fs = { path = "skein/crates/storage-fs", version = "0.0.0" }
skein-storage-s3 = { path = "skein/crates/storage-s3", version = "0.0.0" }
skein-storage-sealed = { path = "skein/crates/storage-sealed", version = "0.0.0" }
skein-storage-tiered = { path = "skein/crates/storage-tiered", version = "0.0.0" }
skein-keyring = { path = "skein/crates/keyring", version = "0.0.0" }
skein-keyring-local = { path = "skein/crates/keyring-local", version = "0.0.0" }
skein-mail = { path = "skein/crates/mail", version = "0.0.0" }
skein-mail-imap = { path = "skein/crates/mail-imap", version = "0.0.0" }
skein-engine = { path = "skein/crates/engine", version = "0.0.0" }
skein-accounts = { path = "skein/crates/accounts", version = "0.0.0" }
skein-server = { path = "skein/crates/server", version = "0.0.0" }
skein-telemetry = { path = "skein/crates/telemetry", version = "0.0.0" }
skein-metrics = { path = "skein/crates/metrics", version = "0.0.0" }
skein-sse = { path = "skein/crates/sse", version = "0.0.0" }
skein-view = { path = "skein/crates/view", version = "0.0.0" }
skein-oauth = { path = "skein/crates/oauth", version = "0.0.0" }
skein-oauth-http = { path = "skein/crates/oauth-http", version = "0.0.0" }
skein-mail-gmail = { path = "skein/crates/mail-gmail", version = "0.0.0" }
skein-mail-graph = { path = "skein/crates/mail-graph", version = "0.0.0" }
skein-mail-jmap = { path = "skein/crates/mail-jmap", version = "0.0.0" }
skein-send = { path = "skein/crates/send", version = "0.0.0" }
skein-send-smtp = { path = "skein/crates/send-smtp", version = "0.0.0" }
skein-send-gmail = { path = "skein/crates/send-gmail", version = "0.0.0" }
skein-send-graph = { path = "skein/crates/send-graph", version = "0.0.0" }
skein-send-jmap = { path = "skein/crates/send-jmap", version = "0.0.0" }
skein-send-ses = { path = "skein/crates/send-ses", version = "0.0.0" }
skein-webhooks = { path = "skein/crates/webhooks", version = "0.0.0" }
skein-push = { path = "skein/crates/push", version = "0.0.0" }
skein-itip = { path = "skein/crates/itip", version = "0.0.0" }
skein-pim = { path = "skein/crates/pim", version = "0.0.0" }
skein-pim-dav = { path = "skein/crates/pim-dav", version = "0.0.0" }
skein-pim-google = { path = "skein/crates/pim-google", version = "0.0.0" }
skein-pim-graph = { path = "skein/crates/pim-graph", version = "0.0.0" }
skein-pim-jmap = { path = "skein/crates/pim-jmap", version = "0.0.0" }
skein-throttle = { path = "skein/crates/throttle", version = "0.0.0" }

rowboat-api = { path = "crates/api" }
rowboat-keystore = { path = "crates/keystore" }
rowboat-keystore-memory = { path = "crates/keystore-memory" }
rowboat-keystore-file = { path = "crates/keystore-file" }
rowboat-discover = { path = "crates/discover" }
rowboat-discover-table = { path = "crates/discover-table" }
rowboat-discover-autoconfig = { path = "crates/discover-autoconfig" }
rowboat-discover-srv = { path = "crates/discover-srv" }
rowboat-discover-net = { path = "crates/discover-net" }
rowboat-spam = { path = "crates/spam" }
rowboat-spam-signals = { path = "crates/spam-signals" }
rowboat-category = { path = "crates/category" }
rowboat-category-bento = { path = "crates/category-bento" }
rowboat-compose = { path = "crates/compose" }
rowboat-node = { path = "crates/node" }
rowboat-endpoint = { path = "crates/endpoint" }
rowboat-endpoint-memory = { path = "crates/endpoint-memory" }
rowboat-endpoint-iroh = { path = "crates/endpoint-iroh" }
rowboat-group = { path = "crates/group" }
rowboat-sync = { path = "crates/sync" }

rinse-mail = { path = "../rinse/crates/mail" }
rinse-mail-direct = { path = "../rinse/crates/mail-direct" }
bento = { path = "../bento/crates/bento" }
bento-notify = { path = "../bento/crates/notify" }
bento-category = { path = "../bento/crates/category" }
bento-insight-view = { path = "../bento/crates/insight-view" }
bento-trust = { path = "../bento/crates/trust" }

anyhow = "1"
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
blake3 = "1.8.7"
bytes = { version = "1", features = ["serde"] }
chacha20poly1305 = "0.11"
curve25519-dalek = "5"
clap = { version = "4", features = ["derive", "env"] }
data-encoding = "2.11"
ed25519-dalek = { version = "2.2", features = ["rand_core", "serde", "zeroize"] }
futures = "0.3"
getrandom = "0.4"
hkdf = "0.13"
hmac = "0.13"
hpke = "0.15"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "service", "tokio"] }
iroh = { version = "1.5", default-features = false, features = ["tls-aws-lc-rs"] }
jsonwebtoken = { version = "12", default-features = false, features = ["aws_lc_rs"] }
mail-parser = "1"
noq = { version = "1.5", default-features = false, features = ["rustls"] }
object_store = { version = "0.14", features = ["aws"] }
opentelemetry = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["grpc-tonic", "trace", "metrics"] }
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
proptest = "1"
qrcodegen = "1.8"
quick-xml = "0.42"
rand_core = { version = "0.6.4", features = ["getrandom"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
redb = "5"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "socks", "stream"] }
rusqlite = { version = "0.43", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2.6"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-io = { package = "tokio", version = "1", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
toml = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "limit", "timeout", "trace"] }
tracing = "0.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ulid = "3"
url = "2.5.9"
webpki-roots = "1"
zeroize = "1.8"
zstd = "0.14"

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
