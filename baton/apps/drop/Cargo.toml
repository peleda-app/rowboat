[package]
name = "baton-drop-service"
description = "The drop service: HTTP server, redb store, configuration, expiry sweeper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.dojo]
kind = "app"

[lib]
name = "baton_drop_service"
path = "src/lib.rs"

[[bin]]
name = "drop"
path = "src/bin/drop.rs"

[dependencies]
baton-core.workspace = true
baton-drop.workspace = true
baton-drop-http.workspace = true
baton-identity.workspace = true
baton-mailbox.workspace = true
async-trait.workspace = true
bytes.workspace = true
redb.workspace = true
rustls.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

[dev-dependencies]
baton-drop = { workspace = true, features = ["testing"] }
baton-mailbox = { workspace = true, features = ["testing"] }
baton-mailbox-drop.workspace = true
rcgen.workspace = true
tempfile.workspace = true
url.workspace = true

[lints]
workspace = true
