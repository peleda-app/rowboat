[package]
name = "baton-lease-server"
description = "Lease arbiter on a server node with no shared store: leases and liveness served over a link"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.dojo]
kind = "implementation"
implements = "baton-lease"

[dependencies]
baton-core.workspace = true
baton-lease.workspace = true
baton-lease-cas.workspace = true
baton-link.workspace = true
baton-state.workspace = true
async-trait.workspace = true
futures.workspace = true
postcard.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util"] }

[dev-dependencies]
baton-identity.workspace = true
baton-lease = { workspace = true, features = ["testing"] }
baton-link-memory.workspace = true
baton-state-memory.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["io-util", "test-util"] }

[lints]
workspace = true
