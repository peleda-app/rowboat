[package]
name = "baton-fuzz"
version = "0.0.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[package.metadata]
cargo-fuzz = true

[package.metadata.dojo]
kind = "fuzz"

[dependencies]
libfuzzer-sys = "0.4"
baton-core = { path = "../crates/core" }
baton-identity = { path = "../crates/identity" }
baton-lease = { path = "../crates/lease" }
baton-seal = { path = "../crates/seal" }
baton-state = { path = "../crates/state" }
baton-state-memory = { path = "../crates/state-memory" }
baton-lease-cas = { path = "../crates/lease-cas" }
baton-mesh = { path = "../crates/mesh" }
baton-group = { path = "../crates/group" }
baton-command = { path = "../crates/command" }
baton-keys = { path = "../crates/keys" }
baton-drop = { path = "../crates/drop" }
baton-mailbox = { path = "../crates/mailbox" }
baton-lease-server = { path = "../crates/lease-server" }
baton-group-server = { path = "../crates/group-server" }
tokio = { version = "1", features = ["rt", "time"] }
bytes = "1"
futures = { version = "0.3", features = ["executor"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[workspace]

[[bin]]
name = "lease_record"
path = "fuzz_targets/lease_record.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roster"
path = "fuzz_targets/roster.rs"
test = false
doc = false
bench = false

