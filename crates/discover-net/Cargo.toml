[package]
name = "rowboat-discover-net"
description = "Networked helpers of mail server discovery: an HTTPS fetcher and a DNS SRV resolver over UDP"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "docs/README.md"

[package.metadata.dojo]
kind = "implementation"
implements = "rowboat-discover"

[dependencies]
rowboat-discover.workspace = true
async-trait.workspace = true
getrandom.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["net", "time"] }

[dev-dependencies]
rowboat-discover = { workspace = true, features = ["testing"] }
skein-core = { workspace = true, features = ["testing"] }
proptest.workspace = true
tokio = { workspace = true, features = ["net", "time", "macros", "rt-multi-thread"] }

[lints]
workspace = true
