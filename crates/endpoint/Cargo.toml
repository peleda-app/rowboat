[package]
name = "rowboat-endpoint"
description = "Contract of the factory of link endpoints the node binds for itself and for pairing"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "docs/README.md"

[package.metadata.dojo]
kind = "contract"

[features]
testing = ["dep:tokio", "dep:futures"]

[dependencies]
baton-identity.workspace = true
baton-link.workspace = true
async-trait.workspace = true
thiserror.workspace = true
futures = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["io-util", "time", "macros", "rt"] }

[lints]
workspace = true
