[package]
name = "skein"
description = "The Skein binary: runs a node with its push receivers from a config file, and manages tenants, accounts, commands and webhooks"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
documentation = "https://peleda-app.github.io/rowboat"
readme = "docs/README.md"
keywords = ["email", "imap", "jmap", "calendar", "sync"]
categories = ["email", "command-line-utilities"]
publish = false

[package.metadata.dojo]
kind = "app"

[features]
default = []
otel = ["skein-telemetry/otel"]

[dependencies]
baton-core.workspace = true
