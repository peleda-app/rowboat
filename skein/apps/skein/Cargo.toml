skein-engine.workspace = true
skein-keyring.workspace = true
skein-keyring-local.workspace = true
skein-mail.workspace = true
skein-mail-gmail.workspace = true
skein-mail-graph.workspace = true
skein-mail-imap.workspace = true
skein-mail-jmap.workspace = true
skein-metrics.workspace = true
skein-oauth.workspace = true
skein-oauth-http.workspace = true
skein-push.workspace = true
skein-pim.workspace = true
skein-pim-dav.workspace = true
skein-pim-google.workspace = true
skein-pim-graph.workspace = true
skein-pim-jmap.workspace = true
skein-send.workspace = true
