[package]
name = "skein-mail-jmap"
description = "The mail contract on JMAP servers: Email/changes feeds, blob downloads, writes and event-source watches"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "docs/README.md"
keywords = ["email", "jmap", "skein"]
categories = ["email", "network-programming"]

[package.metadata.dojo]
kind = "implementation"
implements = "skein-mail"

[dependencies]
skein-core.workspace = true
skein-mail.workspace = true
skein-sse.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
url.workspace = true
zstd.workspace = true

[dev-dependencies]
skein-core = { workspace = true, features = ["testing"] }
skein-mail = { workspace = true, features = ["testing"] }
axum.workspace = true
base64.workspace = true
tokio = { workspace = true, features = ["net", "macros", "rt-multi-thread", "sync", "time"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
