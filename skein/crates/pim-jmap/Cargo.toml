[package]
name = "skein-pim-jmap"
description = "Calendars and contacts on JMAP servers: JSCalendar and JSContact objects, state-based change feeds, conditional writes"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "docs/README.md"
keywords = ["jmap", "jscalendar", "jscontact", "calendar", "contacts"]
categories = ["email", "date-and-time", "network-programming"]

[package.metadata.dojo]
kind = "implementation"
implements = "skein-pim"

[dependencies]
skein-core.workspace = true
skein-pim.workspace = true
async-trait.workspace = true
blake3.workspace = true
bytes.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
skein-pim = { workspace = true, features = ["testing"] }
axum.workspace = true
base64.workspace = true
tokio = { workspace = true, features = ["net", "macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
