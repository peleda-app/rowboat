[dev-dependencies]
skein-send = { workspace = true, features = ["testing"] }
axum.workspace = true
base64.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["net", "macros", "rt-multi-thread", "sync", "time"] }

