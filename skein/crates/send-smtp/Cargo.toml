[package]
name = "skein-send-smtp"
description = "The sending contract over SMTP submission: implicit TLS or STARTTLS, PLAIN, LOGIN or XOAUTH2, DSN"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "docs/README.md"
keywords = ["email", "smtp", "submission", "starttls", "xoauth2"]
categories = ["email", "network-programming"]

[package.metadata.dojo]
kind = "implementation"
implements = "skein-send"

[dependencies]
skein-core.workspace = true
skein-send.workspace = true
async-trait.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time"] }
tokio-rustls.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
skein-core = { workspace = true, features = ["testing"] }
skein-send = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["net", "io-util", "time", "macros", "rt-multi-thread", "sync"] }

[lints]
workspace = true
