[package]
name = "skein-storage-tiered"
description = "Skein storage that reads segments and blobs through untrusted read-only tiers after local storage, verifying every byte"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "docs/README.md"
keywords = ["storage", "tiered", "cache", "skein"]
categories = ["database", "email"]

[package.metadata.dojo]
kind = "implementation"
implements = "skein-storage"

[dependencies]
skein-core.workspace = true
skein-storage.workspace = true
async-trait.workspace = true
bytes.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true

[dev-dependencies]
skein-storage = { workspace = true, features = ["testing"] }
skein-storage-memory.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
