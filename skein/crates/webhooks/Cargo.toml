[package]
name = "skein-webhooks"
description = "Signed webhooks over the journal: endpoints, at-least-once delivery in log order, SSRF-safe HTTPS"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "docs/README.md"
keywords = ["webhooks", "hmac", "journal", "ssrf"]
categories = ["web-programming", "network-programming"]

[package.metadata.dojo]
kind = "library"

[dependencies]
skein-core.workspace = true
skein-engine.workspace = true
skein-keyring.workspace = true
skein-storage.workspace = true
async-trait.workspace = true
base64.workspace = true
blake3.workspace = true
bytes.workspace = true
futures.workspace = true
getrandom.workspace = true
hmac.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
tracing.workspace = true
ulid.workspace = true
url.workspace = true

[dev-dependencies]
skein-keyring-local.workspace = true
skein-storage-memory.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["net", "macros", "rt-multi-thread"] }

[lints]
workspace = true
