[package]
name = "skein-fuzz"
version = "0.0.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[package.metadata]
cargo-fuzz = true

[package.metadata.dojo]
kind = "fuzz"

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
anyhow = "1"
async-trait = "0.1"
base64 = "0.23"
bytes = "1"
mail-parser = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt"] }
zstd = "0.14"
baton-core = { path = "../../baton/crates/core" }
baton-state = { path = "../../baton/crates/state" }
skein-core = { path = "../crates/core" }
skein-itip = { path = "../crates/itip" }
skein-keyring = { path = "../crates/keyring" }
skein-keyring-local = { path = "../crates/keyring-local" }
skein-mail-gmail = { path = "../crates/mail-gmail" }
skein-mail-graph = { path = "../crates/mail-graph" }
skein-mail-imap = { path = "../crates/mail-imap" }
skein-mail-jmap = { path = "../crates/mail-jmap" }
skein-oauth = { path = "../crates/oauth" }
skein-pim-dav = { path = "../crates/pim-dav" }
skein-pim-google = { path = "../crates/pim-google" }
skein-pim-graph = { path = "../crates/pim-graph" }
skein-pim-jmap = { path = "../crates/pim-jmap" }
skein-push = { path = "../crates/push" }
skein-send-smtp = { path = "../crates/send-smtp" }
skein-sse = { path = "../crates/sse" }
skein-storage = { path = "../crates/storage" }
skein-storage-memory = { path = "../crates/storage-memory" }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
debug = 1

[[bin]]
name = "itip"
path = "fuzz_targets/itip.rs"
test = false
doc = false
bench = false

